<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style id="theme">/* hover card: kept with its script so both always update together */
.xtip { display: none; position: fixed; z-index: 99999; width: 230px; background: #ffffff; border-radius: 12px; padding: 12px 14px;
  pointer-events: none; font-size: 12px; color: #475569; border: 1px solid rgba(15,23,42,.07);
  box-shadow: 0 12px 32px rgba(10,36,99,.16), 0 1px 4px rgba(10,36,99,.06); animation: xtin .14s ease-out; }
@keyframes xtin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.xt-top { display: flex; align-items: baseline; justify-content: space-between; }
.xt-v { font-size: 22px; font-weight: 700; color: #0a2463; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.xt-d { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.xt-d.up, .xt-msg.up { color: #15803d; } .xt-d.dn, .xt-msg.dn { color: #b91c1c; } .xt-msg.n { color: #64748b; }
.xt-sub { font-size: 11.5px; color: #94a3b8; margin-top: 1px; font-variant-numeric: tabular-nums; }
.xt-sep { height: 1px; background: #f1f5f9; margin: 10px 0; }
.xt-msg { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
.xt-msg span { color: #94a3b8; font-weight: 500; }
.xt-rng { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: #94a3b8; font-variant-numeric: tabular-nums; }
.xt-rng .t { position: relative; flex: 1; height: 14px; }
.xt-rng .t::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; border-radius: 1px; background: #f1f5f9; }
.xt-rng .t i { position: absolute; left: 10%; right: 10%; top: 5px; height: 4px; border-radius: 2px; background: #cbd5e1; }
.xt-rng .t b { position: absolute; top: 7px; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); background: #0a2463; border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(10,36,99,.25); }
.xt-rng .t b.up { background: #16a34a; box-shadow: 0 0 0 1px rgba(22,163,74,.35); } .xt-rng .t b.dn { background: #dc2626; box-shadow: 0 0 0 1px rgba(220,38,38,.35); }
.xt-h { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; }
.xtip .rev-pop { display: block !important; position: static; margin: 0; padding: 0; border: 0; box-shadow: none; background: none; width: auto; }
.xtip .rev-pop svg { max-width: 100%; height: auto; }
</style>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0f172a; }
  #root { padding: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* A styled HTML table whose input cells (td.ed) are editable in place.
   Streamlit sends {html, css, editable, epoch}; every committed edit is sent back as {key: number|null} for the cells that differ
   from their saved value (data-base). The server recalculates the table and sends fresh html, so calculated rows move as you type. */
var state = { epoch: null, edits: {}, css: null, editable: null };
var lastHeight = 0;

function post(m) { m.isStreamlitMessage = true; window.parent.postMessage(m, "*"); }
function setHeight() { var h = document.documentElement.scrollHeight + 6; if (h !== lastHeight) { lastHeight = h; post({ type: "streamlit:setFrameHeight", height: h }); } }
function send() { post({ type: "streamlit:setComponentValue", value: state.edits, dataType: "json" }); }

window.addEventListener("message", function (ev) {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  var a = ev.data.args || {};
  if (a.css !== state.css) { document.getElementById("theme").textContent = a.css || ""; state.css = a.css; }
  var first = state.epoch === null;
  var reset = !first && a.epoch !== state.epoch;
  if (first) { state.epoch = a.epoch; state.edits = Object.assign({}, a.edits || {}); }      // a fresh frame: pick up what the page still holds
  else if (reset) { state.epoch = a.epoch; state.edits = {}; state.lastSent = null; }
  draw(a);
  if (reset) send();
});

var lastHtml = null, typingTimer = null, keepCaret = false;
function draw(a) {
  if (a.html === lastHtml && !!a.editable === state.editable) { return; }       // same table: do not touch the DOM (it would eat clicks)
  lastHtml = a.html; state.editable = !!a.editable;
  var el = document.activeElement;
  var active = el && el.dataset ? el.dataset.k : null;
  var typed = active ? el.textContent : null;                                   // what is being typed right now
  document.getElementById("root").innerHTML = a.html || "";
  if (a.editable) wire();
  if (active) {
    var again = document.querySelector('td.ed[data-k="' + active.replace(/"/g, '\\"') + '"]');
    if (again) {
      keepCaret = true;                                                          // mid-typing redraw: keep the text and the caret
      again.textContent = typed; again.focus();
      var r = document.createRange(); r.selectNodeContents(again); r.collapse(false);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      keepCaret = false;
    }
  }
  setHeight();
}

function wire() {
  var cells = document.querySelectorAll("td.ed");
  for (var i = 0; i < cells.length; i++) {
    var td = cells[i];
    td.contentEditable = "true";
    td.spellcheck = false;
    td.dataset.shown = td.textContent;
    td.addEventListener("focus", function () {
      if (keepCaret) return;
      var r = document.createRange(); r.selectNodeContents(this);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    });
    td.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {               // Enter: next editable cell down (Shift: up), like a spreadsheet; Tab moves right
        e.preventDefault();
        var all = Array.prototype.slice.call(document.querySelectorAll("td.ed")), col = this.cellIndex, i = all.indexOf(this);
        var step = e.shiftKey ? -1 : 1, next = null;
        for (var j = i + step; j >= 0 && j < all.length; j += step) { if (all[j].cellIndex === col) { next = all[j]; break; } }
        if (next) { next.focus(); } else { this.blur(); }
      }
      else if (e.key === "Escape") { this.textContent = this.dataset.shown; this.blur(); }
    });
    td.addEventListener("input", function () {                                   // live: recalc ~0.7s after typing stops
      var self = this; clearTimeout(typingTimer);
      typingTimer = setTimeout(function () { commit(self, true); }, 700);
    });
    td.addEventListener("blur", function () { clearTimeout(typingTimer); commit(this); });
  }
}

function commit(td, live) {
  var txt = td.textContent.trim().replace(/,/g, "").replace(/%$/, "");
  if (txt === td.dataset.shown.trim().replace(/,/g, "").replace(/%$/, "")) { return; }          // untouched
  if (live && (txt === "" || txt === "-" || txt.slice(-1) === ".")) { return; }                // half-typed number: wait
  var key = td.dataset.k, pct = td.dataset.pct === "1";
  var val;
  if (txt === "") { val = null; }
  else {
    var n = Number(txt);
    if (isNaN(n)) { if (!live) td.textContent = td.dataset.shown; return; }                       // not a number: put it back
    val = pct ? n / 100 : n;
  }
  var base = td.dataset.base === "" ? null : Number(td.dataset.base);
  var same = (val === null && base === null) || (val !== null && base !== null && Math.abs(val - base) < 1e-9);
  if (same) { delete state.edits[key]; } else { state.edits[key] = val; }
  if (JSON.stringify(state.edits) === state.lastSent) { return; }
  state.lastSent = JSON.stringify(state.edits);
  send();
}

// ── hover card for moved / record cells ──
var tip = document.createElement("div"); tip.className = "xtip"; document.body.appendChild(tip);
function f1(x, pct) { return pct ? x.toFixed(0) + "%" : x.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function num(t) { return Number(t.replace(/[,%()]/g, "")) * (/^\(/.test(t) ? -1 : 1); }
function shown(td) { var c = td.cloneNode(true); c.querySelectorAll(".rev-pop, .rev-dot").forEach(function (x) { x.remove(); }); return c.textContent.trim(); }
function card(td) {
  var now = shown(td), h = "<div class='xt-top'><span class='xt-v'>" + now + "</span>", sub = "";
  if (td.dataset.was !== undefined) {
    var d = num(now) - num(td.dataset.was);
    if (!isNaN(d)) h += "<span class='xt-d " + (d >= 0 ? "up" : "dn") + "'>" + (d >= 0 ? "+" : "&minus;") + f1(Math.abs(d), false) + "</span>";
    sub = "<div class='xt-sub'>was " + (td.dataset.was || "&ndash;") + " before your edit</div>";
  }
  h += "</div>" + sub;
  if (td.dataset.lim) {
    var L = JSON.parse(td.dataset.lim), p = L.pct, up = L.k === "hi" || L.k === "nh", near = L.k[0] === "n";
    var rec = up ? L.hi : L.lo, yr = up ? L.yhi : L.ylo, gap = Math.abs(L.v - rec);
    var msg = near ? "Close to 10-yr " + (up ? "high" : "low")
                   : (up ? "New 10-yr high" : "New 10-yr low") + ", " + (up ? "+" : "&minus;") + f1(gap, p);
    var pos = Math.max(2, Math.min(98, 10 + (L.v - L.lo) / ((L.hi - L.lo) || 1) * 80));
    h += "<div class='xt-sep'></div><div class='xt-msg " + (near ? "n" : up ? "up" : "dn") + "'>" + msg +
         " <span>vs " + f1(rec, p) + " in " + yr + "</span></div>" +
         "<div class='xt-rng'><span>" + f1(L.lo, p) + "</span><div class='t'><i></i><b class='" + (near ? "" : up ? "up" : "dn") +
         "' style='left:" + pos + "%'></b></div><span>" + f1(L.hi, p) + "</span></div>";
  }
  var rev = td.querySelector(".rev-pop");
  if (rev) { h += "<div class='xt-sep'></div><div class='xt-h'>Saved revisions</div><div class='rev-pop'>" + rev.innerHTML + "</div>"; }
  return h;
}
document.addEventListener("mouseover", function (e) {
  var td = e.target.closest ? e.target.closest("td[data-lim], td[data-was]") : null;
  if (!td) { tip.style.display = "none"; return; }
  tip.innerHTML = card(td); tip.style.display = "block";
  var r = td.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, r.left + r.width / 2 - w / 2)) + "px";
  tip.style.top = (r.top - hh - 8 >= 4 ? r.top - hh - 8 : r.bottom + 8) + "px";
});
document.documentElement.addEventListener("mouseleave", function () { tip.style.display = "none"; });

post({ type: "streamlit:componentReady", apiVersion: 1 });
setHeight();
</script>
</body>
</html>
