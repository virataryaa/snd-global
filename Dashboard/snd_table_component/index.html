<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style id="theme"></style>
<style id='card-css'>
.panel .spark-wrap:hover .spark-pop, .panel td.rev:hover .rev-pop { display: none !important; }
/* hover card: kept with its script so both always update together */
.xtip { display: none; position: fixed; z-index: 99999; width: 242px; background: #ffffff; border-radius: 12px; padding: 12px 14px;
  pointer-events: none; font-size: 12px; color: #475569; border: 1px solid rgba(15,23,42,.07);
  box-shadow: 0 12px 32px rgba(10,36,99,.16), 0 1px 4px rgba(10,36,99,.06); animation: xtin .14s ease-out; }

.xt-top { display: flex; align-items: baseline; justify-content: space-between; }

.xt-d { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

.xt-msg { font-size: 12px; font-weight: 600; margin-bottom: 8px; }

.xt-rng { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: #94a3b8; font-variant-numeric: tabular-nums; }

.xt-rng .t i { position: absolute; left: 10%; right: 10%; top: 5px; height: 4px; border-radius: 2px; background: #cbd5e1; }
.xt-rng .t b { position: absolute; top: 7px; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); background: #0a2463; border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(10,36,99,.25); }
.xt-rng .t b.up { background: #16a34a; box-shadow: 0 0 0 1px rgba(22,163,74,.35); } .xt-rng .t b.dn { background: #dc2626; box-shadow: 0 0 0 1px rgba(220,38,38,.35); }
.xt-was { font-size: 12px; color: #94a3b8; margin-left: auto; margin-right: 8px; font-variant-numeric: tabular-nums; }
.xi-kv { display: grid; grid-template-columns: auto auto; column-gap: 12px; row-gap: 1px; align-items: baseline; }
.xi-kv > span { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; }
.xi-kv > b { font-variant-numeric: tabular-nums; text-align: right; } .xi-kv .xt-v { font-size: 24px; line-height: 1.15; }
.xi-kv .xi-was { font-size: 13px; font-weight: 500; color: #64748b; } .xi-kv .xt-d { font-size: 13px; } .xi-kv .xt-d i { font-style: normal; opacity: .75; font-weight: 500; }
.xr-list { margin-top: 8px; } .xr { display: grid; grid-template-columns: 92px 1fr auto; column-gap: 8px; align-items: baseline; padding: 4px 0; font-size: 12px; }
.xr + .xr { border-top: 1px solid rgba(10,36,99,.06); } .xr-d { color: #94a3b8; font-size: 11px; white-space: nowrap; } .xr-d i { font-style: normal; color: #64748b; } .xr-d em { font-style: normal; font-size: 9px; font-weight: 700; color: #0f766e; text-transform: uppercase; letter-spacing: .04em; margin-left: 2px; } .xr-v { color: #64748b; font-variant-numeric: tabular-nums; }
.xr-v b { color: #0a2463; } .xr-c { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 11.5px; } .xr-c.up { color: #15803d; } .xr-c.dn { color: #b91c1c; }
.xr-w { grid-column: 2 / 4; color: #94a3b8; font-size: 10.5px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xt-tag { display: inline-block; font-size: 10.5px; font-weight: 600; margin-top: 3px; } .xt-tag.up { color: #15803d; } .xt-tag.dn { color: #b91c1c; }
.xt-h { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; }
.xtip .rev-pop { display: block !important; position: static; margin: 0; padding: 0; border: 0; box-shadow: none; background: none; width: auto; }
.xtip .rev-pop svg { max-width: 100%; height: auto; }

  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0f172a; }
  #root { padding: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* A styled HTML table whose input cells (td.ed) are editable in place.
   Streamlit sends {html, css, editable, epoch}; every committed edit is sent back as {key: number|null} for the cells that differ
   from their saved value (data-base). The server recalculates the table and sends fresh html, so calculated rows move as you type. */
var state = { epoch: null, edits: {}, css: null, editable: null };
var lastHeight = 0;

window.addEventListener("message", function (ev) {

  var a = ev.data.args || {};

  if (first) { state.epoch = a.epoch; state.edits = Object.assign({}, a.edits || {}); }      // a fresh frame: pick up what the page still holds
  else if (reset) { state.epoch = a.epoch; state.edits = {}; state.lastSent = null; }
  draw(a);
  if (reset) send();
});

var lastHtml = null, typingTimer = null, keepCaret = false;
function draw(a) {
  if (a.html === lastHtml && !!a.editable === state.editable) { return; }       // same table: do not touch the DOM (it would eat clicks)
  lastHtml = a.html; state.editable = !!a.editable;
  var el = document.activeElement;
  var active = el && el.dataset ? el.dataset.k : null;
  var typed = active ? el.textContent : null;                                   // what is being typed right now
  document.getElementById("root").innerHTML = a.html || "";
  if (a.editable) wire();
  if (active) {
    var again = document.querySelector('td.ed[data-k="' + active.replace(/"/g, '\\"') + '"]');
    if (again) {
      keepCaret = true;                                                          // mid-typing redraw: keep the text and the caret
      again.textContent = typed; again.focus();
      var r = document.createRange(); r.selectNodeContents(again); r.collapse(false);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      keepCaret = false;
    }
  }
  setHeight();
}

function wire() {
  var cells = document.querySelectorAll("td.ed");
  for (var i = 0; i < cells.length; i++) {
    var td = cells[i];
    td.contentEditable = "true";
    td.spellcheck = false;
    td.dataset.shown = td.textContent;
    td.addEventListener("focus", function () {
      if (keepCaret) return;
      var r = document.createRange(); r.selectNodeContents(this);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    });
    td.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {               // Enter: next editable cell down (Shift: up), like a spreadsheet; Tab moves right
        e.preventDefault();
        var all = Array.prototype.slice.call(document.querySelectorAll("td.ed")), col = this.cellIndex, i = all.indexOf(this);
        var step = e.shiftKey ? -1 : 1, next = null;
        for (var j = i + step; j >= 0 && j < all.length; j += step) { if (all[j].cellIndex === col) { next = all[j]; break; } }
        if (next) { next.focus(); } else { this.blur(); }
      }
      else if (e.key === "Escape") { this.textContent = this.dataset.shown; this.blur(); }
    });
    td.addEventListener("input", function () {                                   // live: recalc ~0.7s after typing stops
      var self = this; clearTimeout(typingTimer);
      typingTimer = setTimeout(function () { commit(self, true); }, 700);
    });
    td.addEventListener("blur", function () { clearTimeout(typingTimer); commit(this); });
  }
}

function commit(td, live) {
  var txt = td.textContent.trim().replace(/,/g, "").replace(/%$/, "");
  if (txt === td.dataset.shown.trim().replace(/,/g, "").replace(/%$/, "")) { return; }          // untouched
  if (live && (txt === "" || txt === "-" || txt.slice(-1) === ".")) { return; }                // half-typed number: wait
  var key = td.dataset.k, pct = td.dataset.pct === "1";
  var val;
  if (txt === "") { val = null; }
  else {
    var n = Number(txt);
    if (isNaN(n)) { if (!live) td.textContent = td.dataset.shown; return; }                       // not a number: put it back
    val = pct ? n / 100 : n;
  }
  var base = td.dataset.base === "" ? null : Number(td.dataset.base);
  var same = (val === null && base === null) || (val !== null && base !== null && Math.abs(val - base) < 1e-9);
  if (same) { delete state.edits[key]; } else { state.edits[key] = val; }
  if (JSON.stringify(state.edits) === state.lastSent) { return; }
  state.lastSent = JSON.stringify(state.edits);
  send();
}

// ── hover card for moved / record cells ──
var tip = document.createElement("div"); tip.className = "xtip"; document.body.appendChild(tip);
function f1(x, pct) { return pct ? x.toFixed(0) + "%" : x.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function num(t) { return Number(t.replace(/[,%()]/g, "")) * (/^\(/.test(t) ? -1 : 1); }
function shown(td) { var c = td.cloneNode(true); c.querySelectorAll(".rev-pop, .rev-dot").forEach(function (x) { x.remove(); }); return c.textContent.trim(); }
function sy(t) { return t.replace(/^\d{2}(\d{2}\/\d{2})/, "$1"); }   // 2026/27* -> 26/27*
function bars(td, tone, rec, recLab) {

  var tds = Array.prototype.filter.call(td.parentNode.children, function (c) { return c.tagName === "TD" && !c.classList.contains("lbl") && !c.classList.contains("spark-td"); });
  var v = tds.map(function (c) { return num(shown(c)); }), i = tds.indexOf(td);
  var was = tds.map(function (c) { return c.dataset.was !== undefined && c.dataset.was !== "" ? num(c.dataset.was) : NaN; });
  var ok = v.concat(was).filter(function (x) { return !isNaN(x); }); if (ok.length < 2) return "";
  var hi = Math.max.apply(null, ok.concat([0, rec === null ? 0 : rec])), lo = Math.min.apply(null, ok.concat([0, rec === null ? 0 : rec]));
  var hdr = null;                                                // crop years from the header row above
  for (var r = td.parentNode.previousElementSibling; r; r = r.previousElementSibling) { if (r.querySelector("th.y")) { hdr = r; break; } }
  var yrs = tds.map(function (c) { var th = hdr ? hdr.children[Array.prototype.indexOf.call(c.parentNode.children, c)] : null; return th ? sy(th.textContent.trim()) : ""; });
  var W = 400, B = 15, H = 100, T = 14, n = v.length, bw = W / n, y = function (x) { return T + (hi - x) / ((hi - lo) || 1) * (H - B - T - 4); };
  var col = { up: ["#22c55e", "#15803d"], dn: ["#f87171", "#b91c1c"], v: ["#a78bfa", "#6d28d9"] }[tone];
  var g = "<defs><linearGradient id='xg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='" + col[0] + "'/><stop offset='1' stop-color='" + col[1] + "'/></linearGradient>" +
          "<linearGradient id='xm' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#ddd6fe'/><stop offset='1' stop-color='#c4b5fd'/></linearGradient>" +
          "<pattern id='xh' width='4' height='4' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='1.4' height='4' fill='#64748b' opacity='.45'/></pattern></defs>";
  var bx = function (j) { return j * bw + bw * .2; }, ww = bw * .6;
  var bar = function (j, x, fill, extra) {
    var t = Math.min(y(x), y(0)), h = Math.max(2, Math.abs(y(x) - y(0)));
    return "<rect x='" + bx(j).toFixed(1) + "' y='" + t.toFixed(1) + "' width='" + ww.toFixed(1) + "' height='" + h.toFixed(1) + "' rx='2.5' fill='" + fill + "'" + (extra || "") + "/>";
  };
  v.forEach(function (x, j) {
    if (isNaN(x)) return;
    var moved = !isNaN(was[j]) && Math.abs(was[j] - x) > 1e-9;
    if (moved) g += bar(j, was[j], "url(#xh)");                                   // before the edit: hatched
    g += "<text x='" + (bx(j) + ww / 2).toFixed(1) + "' y='" + (H - 3) + "' font-size='8.5' text-anchor='middle' font-family='Inter, system-ui, sans-serif' fill='" +
         (j === i ? "#0a2463' font-weight='700" : "#94a3b8") + "'>" + yrs[j] + "</text>";
    g += bar(j, x, j === i ? "url(#xg)" : moved ? "url(#xm)" : "#b9c4d6", j === i ? " filter='drop-shadow(0 2px 3px rgba(15,23,42,.18))'" : "");
    if (moved) g += "<line x1='" + (bx(j) - 2).toFixed(1) + "' x2='" + (bx(j) + ww + 2).toFixed(1) + "' y1='" + y(was[j]).toFixed(1) + "' y2='" + y(was[j]).toFixed(1) +
                    "' stroke='#334155' stroke-width='1.6' stroke-linecap='round'/>";   // cap where it was
  });
  g += "<line x1='0' x2='" + W + "' y1='" + y(0).toFixed(1) + "' y2='" + y(0).toFixed(1) + "' stroke='#cbd5e1' stroke-width='1'/>";
  if (rec !== null) {
    var ry = y(rec).toFixed(1);
    g += "<line x1='0' x2='" + W + "' y1='" + ry + "' y2='" + ry + "' stroke='" + col[1] + "' stroke-width='1' stroke-dasharray='3 3' opacity='.45'/>";
  }
  return "<svg width='" + W + "' height='" + H + "' style='display:block;overflow:visible'>" + g + "</svg>";
}
function card(td) {
  var now = shown(td), was = td.dataset.was, d = was !== undefined ? num(now) - num(was) : NaN, pc = d / Math.abs(num(was)) * 100;
  var L = td.dataset.lim ? JSON.parse(td.dataset.lim) : null, brk = L && (L.k === "hi" || L.k === "lo");
  var tone = brk ? (L.k === "hi" ? "up" : "dn") : "v";
  var h = "<div class='xi-kv'><span>Now</span><b class='xt-v'>" + now + "</b>";
  if (!isNaN(d)) {
    h += "<span>Before</span><b class='xi-was'>" + (was || "&ndash;") + "</b>" +
         "<span>Change</span><b class='xt-d " + (d >= 0 ? "up" : "dn") + "'>" + (d >= 0 ? "+" : "&minus;") + f1(Math.abs(d), false) +
         (isFinite(pc) ? "<i> (" + (d >= 0 ? "+" : "&minus;") + Math.abs(pc).toFixed(0) + "%)</i>" : "") + "</b>";
  }
  h += "</div>";
  if (brk) h += "<span class='xt-tag " + tone + "'>" + (L.k === "hi" ? "&#9650; New 10-yr high" : "&#9660; New 10-yr low") + "</span>";
  return h + bars(td, tone, brk ? (L.k === "hi" ? L.hi : L.lo) : null,
                  brk ? (L.k === "hi" ? "high " + f1(L.hi, L.pct) + " \u00b7 " + sy(L.yhi) : "low " + f1(L.lo, L.pct) + " \u00b7 " + sy(L.ylo)) : "");
}
var P = null, panel = null, hideT = null;
try { P = window.parent.document; P.body; } catch (err) { P = null; }
function ensurePanel() {
  if (!P) return null;
  panel = P.getElementById("snd-xinfo");
  if (!panel) {
    var st = P.createElement("style"); st.id = "snd-xinfo-css";
    st.textContent = document.getElementById("card-css").textContent +
      "#snd-xinfo { position: fixed; left: 50%; transform: translateX(-50%); z-index: 999; display: none; align-items: center; gap: 16px;" +
      " padding: 10px 16px; border-radius: 16px; background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(22px) saturate(180%);" +
      " backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.7); font-family: Inter, system-ui, sans-serif;" +
      " box-shadow: 0 0 0 1px rgba(10,36,99,.06), 0 14px 40px rgba(10,36,99,.20); pointer-events: none; color: #475569; }" +
      "#snd-xinfo { gap: 24px; padding: 14px 22px; border-radius: 18px; max-width: 94vw; }" +
      "#snd-xinfo .xi-l { min-width: 170px; } #snd-xinfo .xi-n { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; margin-bottom: 2px; }" +
      "#snd-xinfo .xt-v { font-size: 26px; } #snd-xinfo .xt-d, #snd-xinfo .xt-was { font-size: 14px; } #snd-xinfo .xt-tag { font-size: 12px; }" +
      "#snd-xinfo .xi-r { font-size: 12px; min-width: 260px; max-height: 240px; overflow: hidden; border-left: 1px solid rgba(10,36,99,.08); padding-left: 18px; }" +
      "#snd-xinfo .row { padding: 3px 0; white-space: nowrap; } #snd-xinfo .row + .row { border-top: 1px solid rgba(10,36,99,.06); }" +
      "#snd-xinfo .dt { color: #94a3b8; margin-right: 8px; } #snd-xinfo .rs { color: #94a3b8; margin-left: 8px; }" +
      "#snd-xinfo { transition: box-shadow .25s, border-color .25s; }" +
      "#snd-xinfo[data-tone='up'] { border-color: rgba(34,197,94,.45); box-shadow: 0 0 0 1px rgba(34,197,94,.18), 0 0 22px rgba(34,197,94,.22), 0 14px 40px rgba(10,36,99,.16); }" +
      "#snd-xinfo[data-tone='dn'] { border-color: rgba(239,68,68,.45); box-shadow: 0 0 0 1px rgba(239,68,68,.18), 0 0 22px rgba(239,68,68,.22), 0 14px 40px rgba(10,36,99,.16); }" +
      "#snd-xinfo[data-tone='v'] { border-color: rgba(139,92,246,.40); box-shadow: 0 0 0 1px rgba(139,92,246,.16), 0 0 22px rgba(139,92,246,.20), 0 14px 40px rgba(10,36,99,.16); }" +
      "#snd-xinfo .xi-c svg { display: block; } #snd-xinfo .xi-r svg { display: block; width: 220px; height: auto; margin: 2px 0 4px; }" +
      "#snd-xinfo .xt-top { justify-content: flex-start; gap: 8px; } #snd-xinfo .xt-was { margin-left: 0; margin-right: 0; }" +
      "#snd-xinfo svg { margin-top: 0 !important; }";
    P.head.appendChild(st);
    panel = P.createElement("div"); panel.id = "snd-xinfo"; P.body.appendChild(panel);
  }
  return panel;
}
function where(td) {
  var tr = td.parentNode, lbl = tr.querySelector("td.lbl"), col = Array.prototype.indexOf.call(tr.children, td), yr = "";
  for (var r = tr.previousElementSibling; r; r = r.previousElementSibling) {
    if (r.querySelector("th.y")) { var th = r.children[col]; yr = th ? th.textContent.trim() : ""; break; }
  }
  return (lbl ? shown(lbl) : "") + (yr && !td.classList.contains("spark-td") ? " &middot; " + sy(yr) : "");
}
var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function revView(rev, wide) {
  // rows look like: <span class='dt'>2026-10-22</span>100.0 -> 99.0<span class='rs'>reason</span>; newest first
  var rs = Array.prototype.map.call(rev.querySelectorAll(".row"), function (r) {
    var de = r.querySelector(".dt"), dt = de ? (de.getAttribute("data-ts") || de.textContent) : "", why = (r.querySelector(".rs") || {}).textContent || "";
    var c = r.cloneNode(true); c.querySelectorAll(".dt, .rs").forEach(function (x) { x.remove(); });
    var m = c.textContent.split(/→|->/);
    return { dt: dt.trim(), o: num((m[0] || "").trim()), n: num((m[1] || "").trim()), ot: (m[0] || "").trim(), nt: (m[1] || "").trim(), why: why.trim() };
  });
  if (!rs.length) return "";
  var pts = rs.slice().reverse();                               // oldest -> newest: each save is a point (value above, date below)
  var vals = pts.map(function (r) { return r.n; }), when = pts.map(function (r) { return r.dt; });
  var W = 300, H = 92, P = 18;
  var ok = vals.filter(function (x) { return !isNaN(x); }); if (!ok.length) return "";
  var hi = Math.max.apply(null, ok), lo = Math.min.apply(null, ok), sp = (hi - lo) || 1, n = vals.length, last = n - 1;
  var X = function (i) { return n === 1 ? W / 2 : P + i * (W - 2 * P) / last; }, Y = function (v) { return 20 + (hi - v) / sp * (H - 46); };
  var day = function (d) { var t = new Date(d); return isNaN(t) ? d : t.getDate() + " " + MON[t.getMonth()]; };
  var step = n > 6 ? 2 : 1, F = " font-family='Inter, system-ui, sans-serif' text-anchor='middle'";
  var g = "<path d='" + vals.map(function (v, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); }).join(" ") +
          "' fill='none' stroke='#5b74a8' stroke-width='1.8' stroke-linejoin='round'/>";
  vals.forEach(function (v, i) {
    var L = i === last, show = L || (last - i) % step === 0;
    g += "<circle cx='" + X(i).toFixed(1) + "' cy='" + Y(v).toFixed(1) + "' r='" + (L ? 3.8 : 2.4) + "' fill='" + (L ? "#0a2463" : "#94a3b8") + "'/>";
    if (show) g += "<text x='" + X(i).toFixed(1) + "' y='" + (Y(v) - 7).toFixed(1) + "' font-size='9.5'" + F + " fill='" + (L ? "#0a2463' font-weight='700" : "#64748b") + "'>" + f1(v, false) + "</text>" +
                   "<text x='" + X(i).toFixed(1) + "' y='" + (H - 2) + "' font-size='9'" + F + " fill='" + (L ? "#0a2463' font-weight='600" : "#94a3b8") + "'>" + day(when[i]) + "</text>";
  });
  return "<div class='xi-r'><div class='xi-n'>Saved revisions &middot; " + rs.length + "</div><svg width='" + W + "' height='" + H + "' viewBox='0 0 " + W + " " + H +
         "' style='display:block;overflow:visible;margin-top:4px'>" + g + "</svg></div>";
}
function panelHtml(t) {
  var sp = t.closest(".spark-wrap");
  if (sp) {                                                   // Trend: the detailed sparkline
    var td = sp.closest("td"), pop = sp.querySelector(".spark-pop");
    return pop ? "<div class='xi-l'><div class='xi-n'>" + where(td) + "</div><div class='xt-sub'>Trend, all crop years</div></div><div class='xi-c'>" + pop.innerHTML + "</div>" : "";
  }
  var td = t.closest("td[data-lim], td[data-was], td.rev");
  if (!td) return "";
  var left = "", chart = "", right = "";
  if (td.dataset.lim || td.dataset.was !== undefined) {
    var c = card(td), k = c.indexOf("<svg");
    left = k < 0 ? c : c.slice(0, k); chart = k < 0 ? "" : c.slice(k);
  } else {
    left = "<div class='xt-top'><span class='xt-v'>" + shown(td) + "</span></div>";
  }
  var rev = td.querySelector(".rev-pop");
  if (rev) right = revView(rev, !chart);                      // saved revisions: own clean chart + short list
  return "<div class='xi-l'><div class='xi-n'>" + where(td) + "</div>" + left + "</div>" + (chart ? "<div class='xi-c'>" + chart + "</div>" : "") + right;
}
if (P) document.documentElement.classList.add("panel");      // pop-ups inside the table give way to the panel
document.addEventListener("mouseover", function (e) {
  var pn = ensurePanel();
  if (pn) {
    var html = e.target.closest ? panelHtml(e.target) : "";
    if (!html) { clearTimeout(hideT); hideT = setTimeout(function () { pn.style.display = "none"; }, 250); return; }
    clearTimeout(hideT);
    pn.innerHTML = html;
    pn.setAttribute("data-tone", /xt-tag up/.test(html) ? "up" : /xt-tag dn/.test(html) ? "dn" : /Before</.test(html) ? "v" : "n");   // soft glow in the cell's colour
    pn.style.bottom = P.querySelector(".st-key-edit_bar") ? "88px" : "20px";   // sits above the save bar when that is up
    pn.style.display = "flex";
    return;
  }
  var td = e.target.closest ? e.target.closest("td[data-lim], td[data-was]") : null;
  if (!td) { tip.style.display = "none"; return; }
  tip.innerHTML = card(td); tip.style.display = "block";
  var r = td.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, r.left + r.width / 2 - w / 2)) + "px";
  tip.style.top = (r.top - hh - 8 >= 4 ? r.top - hh - 8 : r.bottom + 8) + "px";
});
document.documentElement.addEventListener("mouseleave", function () {
  tip.style.display = "none";
  if (panel) { clearTimeout(hideT); hideT = setTimeout(function () { panel.style.display = "none"; }, 250); }
});

post({ type: "streamlit:componentReady", apiVersion: 1 });
setHeight();
</script>
